services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: codesense-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: codesense
      POSTGRES_USER: codesense
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - codesense_pgdata:/var/lib/postgresql/data
      - ./docker/init-extensions.sh:/docker-entrypoint-initdb.d/init-extensions.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codesense -d codesense"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  codesense_pgdata:
