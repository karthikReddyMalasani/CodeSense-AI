spring:
  application:
    name: codesense-ai

  # ─── Database ──────────────────────────────────────────────────────────────
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/codesense}
    username: ${DATABASE_USERNAME:codesense}
    password: ${DATABASE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 600000
      keepalive-time: 60000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # ─── File Upload ───────────────────────────────────────────────────────────
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE_MB:100}MB
      max-request-size: ${MAX_UPLOAD_SIZE_MB:100}MB
      enabled: true

  # ─── Security ──────────────────────────────────────────────────────────────
  security:
    user:
      name: admin
      password: disabled

# ─── Server ──────────────────────────────────────────────────────────────────
server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# ─── JWT ─────────────────────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:please-change-this-secret-key-in-production-it-must-be-at-least-64-characters-long}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# ─── Google Gemini ───────────────────────────────────────────────────────────
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.5-flash}
  endpoint: ${GEMINI_ENDPOINT:https://generativelanguage.googleapis.com/v1beta/models}

# ─── AI Configuration ────────────────────────────────────────────────────────
codesense:
  ai:
    # Use gemini for real AI, mock for tests/offline
    llm-provider: ${AI_LLM_PROVIDER:gemini}
    embedding-provider: ${AI_EMBEDDING_PROVIDER:mock}
    embedding-dimension: ${EMBEDDING_DIMENSION:768}
    rag:
      top-k: 5
      min-similarity: 0.7
      max-context-tokens: 4096
    ingestion:
      chunk-size: 1000
      chunk-overlap: 200
      batch-size: 50
    excluded-paths:
      - .git
      - node_modules
      - target
      - build
      - dist
      - .idea
      - .vscode
      - __pycache__
      - .pytest_cache
      - vendor
    excluded-extensions:
      - .class
      - .jar
      - .war
      - .zip
      - .tar
      - .gz
      - .png
      - .jpg
      - .jpeg
      - .gif
      - .svg
      - .ico
      - .pdf
      - .bin
      - .exe
      - .dll
      - .so
      - .lock

  github:
    access-token: ${GITHUB_ACCESS_TOKEN:}

  upload:
    directory: ${UPLOAD_DIR:./uploads}

# ─── Swagger / OpenAPI ───────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# ─── Actuator ────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: codesense-ai

# ─── Logging ─────────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.codesense: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
